definitions:
  order_dto.CreateOrderRequest:
    properties:
      productId:
        type: integer
      quantity:
        type: integer
      sellerId:
        type: integer
    type: object
  order_dto.UpdateOrderRequest:
    properties:
      productId:
        type: integer
      quantity:
        type: integer
    type: object
  product_dto.CreateProductRequest:
    properties:
      category:
        type: string
      description:
        type: string
      name:
        type: string
      price:
        type: integer
      sellerId:
        type: integer
    type: object
  product_dto.UpdateProductRequest:
    properties:
      category:
        type: string
      description:
        minLength: 10
        type: string
      name:
        maxLength: 100
        minLength: 3
        type: string
      price:
        minimum: 1
        type: integer
    required:
    - category
    - description
    - name
    - price
    type: object
  seller_dto.CreateSellerRequest:
    properties:
      category:
        type: string
      description:
        type: string
      name:
        type: string
    type: object
